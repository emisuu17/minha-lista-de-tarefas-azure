<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Minhas tarefas</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <header>
      <h1>Minhas tarefas</h1>
      <p>Organize suas atividades em um só lugar.</p>
    </header>
    <section class="card">
      <form id="task-form">
        <input id="task-input" type="text" placeholder="Digite uma nova tarefa..." maxlength="100" required>
        <button type="submit">Adicionar tarefa</button>
      </form>
      <div class="list-heading">
        <h2>Lista de tarefas</h2>
        <span id="task-count" class="count">0 tarefas</span>
      </div>
      <ul id="task-list" aria-live="polite"></ul>
      <p id="empty-state" class="empty-state">Você ainda não tem tarefas. Adicione a primeira acima.</p>
    </section>
    <footer>
      <span id="status" aria-live="polite">Sua lista está vazia.</span>
      <button id="clear-button" class="secondary" type="button">Limpar lista</button>
    </footer>
  </main>
  <script src="app.js"></script>
</body>
</html>
